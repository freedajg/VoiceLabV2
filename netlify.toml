# VoiceLab — Netlify configuration
# Static Vite SPA + Netlify Functions (v2, ESM) + Netlify Blobs (zero-config storage).

[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# Pinned rather than inherited: Netlify's default Node version differs between
# older and newly created sites, and Vite 6 needs 18+. Pinning removes the
# ambiguity so the first deploy on a fresh site behaves like local.
[build.environment]
  NODE_VERSION = "22"

[dev]
  command = "npm run vite"
  targetPort = 5219
  port = 8888
  framework = "#custom"

# JSMB multi-agent prototype — a second SPA entry. Must precede the catch-all
# below, because Netlify applies redirect rules in order. The app itself uses
# hash routing, so one rule covers every deep link.
[[redirects]]
  from = "/jsmb"
  to = "/jsmb.html"
  status = 200

[[redirects]]
  from = "/jsmb/*"
  to = "/jsmb.html"
  status = 200

# SPA fallback so client routing / deep links resolve to index.html.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Optional environment variables surfaced by the "Deploy to Netlify" button.
# NONE are required — the app runs and is useful with all of these unset.
[template.environment]
  DEEPGRAM_API_KEY = "Optional. Enables the Transcription card. Get a free key (hundreds of hours of credit) at https://console.deepgram.com/signup"
  GEMINI_API_KEY   = "Optional. Enables the Prompt Helper card. Get a free key at https://aistudio.google.com/apikey"
  SITE_PASSWORD    = "Optional. Set a password to lock your VoiceLab behind a single login screen."
  RETELL_API_KEY   = "Optional. Enables signature verification on the Testing webhook. Leave blank to accept calls via the per-project token only."
